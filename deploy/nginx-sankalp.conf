# nginx in front of SANKALP (TLS, SSE/WebSocket friendly). Replace server_name and certificate paths.
server {
  listen 443 ssl http2;
  server_name sankalp.example.gov.in;
  ssl_certificate     /etc/ssl/sankalp/fullchain.pem;
  ssl_certificate_key /etc/ssl/sankalp/privkey.pem;
  client_max_body_size 25m;          # proof photos / voice recordings
  location / {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;   # WebSocket /ws
    proxy_set_header Connection "upgrade";
    proxy_buffering off;                      # SSE streams
    proxy_read_timeout 3600s;
  }
}
server { listen 80; server_name sankalp.example.gov.in; return 301 https://$host$request_uri; }
