# Render blueprint (P7.2, D-024): the existing pilot hosting, as code.
# NOTE: Render has no Indian region. Use it for pilots/demos; for production data residency deploy on a
# MeitY-empanelled Indian cloud or the State Data Centre with deploy/install-onprem.sh (docs/DEPLOYMENT.md).
services:
  - type: web
    name: sankalp-ai
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run expo:static:build && npm run server:build
    startCommand: npm run server:prod
    healthCheckPath: /healthz
    autoDeploy: false
    disk:
      name: sankalp-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: JWT_SECRET
        generateValue: true
      - key: DEPT_JWT_SECRET
        generateValue: true
      - key: EVIDENCE_ENC_KEY
        sync: false   # set once (64 hex chars) and keep it in a password manager — needed to read evidence after restore
      - key: PUBLIC_BASE_URL
        sync: false
      - key: EGRESS_ALLOWLIST
        value: api.sarvam.ai
      - key: SARVAM_API_KEY
        sync: false
      - key: DEFAULT_TENANT
        value: uttarakhand
  # No backup cron here (review P7-4): Render disks attach to one service only, so a separate cron service can
  # never read DATA_DIR. For the pilot, take backups from a machine with access (docs/DR.md) or move production
  # to an Indian VM with deploy/install-onprem.sh, where scripts/backup.sh runs from a systemd timer or cron.
